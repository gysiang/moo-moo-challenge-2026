services:
  coordinator:
    build:
      context: ..
      dockerfile: deploy/coordinator.Dockerfile
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - coordinator-state:/state
      - type: bind
        source: ${COORDINATOR_ENV_FILE:?Set the cloud host path to its read-only .env}
        target: /run/secrets/.env
        read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
volumes:
  coordinator-state:
    external: true
    name: ${COORDINATOR_VOLUME:?Provision a durable single-host volume first}
